<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>報價單</title>
<!-- 兩種版面：
     圖文版（預設 10 項以內）：一項一列，大圖＋品名＋介紹重點＋官網 QR＋數量單價金額
     清單版（預設 11 項以上）：前面是原本的報價單表格，後面附「商品圖片與介紹」圖錄頁，用序號對應
     表頭、客戶卡、合計、簽章照 NAS 報價單產生器\quote_tpl_seq.py -->
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif;color:#1f2933;font-size:9.4pt;background:#e9ecef}
.bar{position:sticky;top:0;z-index:3;background:#1f2933;color:#fff;padding:8px 16px;display:flex;gap:10px;align-items:center;font-size:14px;flex-wrap:wrap}
.bar button,.bar select{font:inherit;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;background:#b4232a;color:#fff}
.bar select{background:#fff;color:#1f2933}
.bar button.erp{background:#1d5f8a}
.bar span{opacity:.85;font-size:13px}
#root{padding:12px 0}
.page{width:210mm;height:297mm;padding:14mm 13mm 13mm;display:flex;flex-direction:column;overflow:hidden;position:relative;background:#fff;margin:0 auto 12px;box-shadow:0 1px 6px rgba(0,0,0,.15)}
@media print{body{background:#fff}.bar{display:none}#root{padding:0}.page{margin:0;box-shadow:none;break-after:page}.page:last-child{break-after:auto}}
.body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.end{margin-top:auto;padding-top:4mm}
.pf{position:absolute;left:13mm;right:13mm;bottom:6mm;font-size:7pt;color:#9aa5b1;display:flex;justify-content:space-between}
.cont{font-size:8pt;color:#7b8794;margin-top:2.5mm;text-align:right}
.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #1f2933;padding-bottom:3.5mm}
.co h1{font-size:16pt;font-weight:700;letter-spacing:.5px}
.co p{font-size:8pt;color:#52606d;margin-top:1mm;line-height:1.55}
.ttl{text-align:right}.ttl h2{font-size:20pt;letter-spacing:7px;color:#b4232a;line-height:1}
.ttl .en{font-size:7pt;letter-spacing:3.5px;color:#7b8794;margin-top:1mm}
.info{display:grid;grid-template-columns:1.7fr 1fr;gap:4mm;margin-top:4mm}
.card{border:1px solid #d9dee3;border-radius:1.5mm;padding:2.6mm 3.5mm;display:grid;grid-template-columns:17mm 1fr;row-gap:1.3mm;font-size:9pt}
.card.cu{border-left:3.5px solid #b4232a}
.k{color:#7b8794;font-size:8pt;padding-top:.3mm}
.big{font-weight:700;font-size:11pt}
.b{font-weight:600}
/* 清單版表格 */
table.it{width:100%;border-collapse:collapse;margin-top:4.5mm}
table.it th{background:#1f2933;color:#fff;font-weight:500;font-size:8.3pt;padding:1.8mm 1.6mm;letter-spacing:.5px;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.it td{padding:1.6mm 1.6mm;border-bottom:1px solid #e4e7eb;vertical-align:top;line-height:1.4}
table.it tr.g1 td{border-top:1px solid #b8c0c8}
.rm{font-size:8pt;color:#b4232a}
.r{text-align:right!important}.c{text-align:center!important}
.n{color:#7b8794}
.pid{font-size:7.6pt;color:#52606d;letter-spacing:.2px;white-space:nowrap}
/* 圖文版：照紙本大小設計——主圖 60mm、其他圖半頁寬（約 89mm），字多的圖也看得清楚 */
.hd2{display:grid;grid-template-columns:60mm 1fr 34mm;gap:4mm;margin-top:4.5mm;background:#1f2933;color:#fff;font-size:8.3pt;padding:1.8mm 2mm;letter-spacing:.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.list{display:flex;flex-direction:column}
.ci{display:grid;grid-template-columns:60mm 1fr 34mm;gap:4mm;padding:3.5mm 2mm 3mm;border-top:1px solid #c5ccd3}
.ci .im{width:60mm;height:60mm;border:1px solid #eef0f2;border-radius:1.5mm;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.ci .im img{max-width:100%;max-height:100%;object-fit:contain}
.ci .im.no{color:#c5ccd3;font-size:8pt}
.ci .no{font-weight:700;color:#b4232a;margin-right:1.5mm}
.ci .nm{font-size:11pt;font-weight:700;line-height:1.4}
.ci .sk{font-size:7.6pt;color:#7b8794;margin-top:.6mm}
.ci ul{margin-top:1.8mm;padding-left:4mm;font-size:8.8pt;line-height:1.65;color:#323f4b}
.lk{display:flex;gap:2.5mm;align-items:center;margin-top:2mm;font-size:7.6pt;color:#52606d;text-decoration:none}
.lk svg{width:18mm;height:18mm;flex:none}
.ci .pr{text-align:right;font-size:8.6pt;color:#52606d;line-height:1.7}
.ci .pr b{display:block;font-size:14pt;color:#b4232a;margin-top:1mm}
.ci .cs{font-size:8pt;color:#b4232a;margin-top:1mm}
.exr{display:grid;grid-template-columns:repeat(6,1fr);gap:4mm;padding:0 2mm 3.5mm;align-items:start}
.exr figure{border:1px solid #eef0f2;border-radius:1.5mm;background:#fff;padding:1.5mm;position:relative}
.exr figure.S{grid-column:span 2}.exr figure.M{grid-column:span 3}.exr figure.L{grid-column:span 6}
.exr .ph{display:flex;align-items:center;justify-content:center;overflow:hidden}
.exr .S .ph{height:50mm}.exr .M .ph{height:72mm}.exr .L .ph{height:150mm}
/* 浮動排版：放不下時先壓矮一點再試（字還看得清楚的最小高度） */
.exr img{max-width:100%;max-height:100%;object-fit:contain}
/* 編排模式（只在螢幕上，列印不會出現） */
.ed{display:none}
body.edit .ed{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px;background:#fff7e6;border:1px dashed #e0a100;border-radius:4px;padding:3px 6px;margin:2mm 2mm 0}
body.edit .ed select,body.edit .ed button{font-size:12px;padding:1px 6px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer}
body.edit figure,body.edit .ci .im,body.edit .gi .im{cursor:grab;outline:2px dashed #e0a100;outline-offset:1px}
body.edit .drop-on{outline:3px solid #1d5f8a!important}
body.edit .fx{display:flex;gap:3px;position:absolute;top:2mm;right:2mm;background:rgba(255,255,255,.92);border-radius:4px;padding:2px}
.fx{display:none}
@media print{.ed,.fx{display:none!important}body.edit figure,body.edit .ci .im{outline:none}}
.exr figcaption{font-size:7.6pt;color:#7b8794;margin-top:1mm}
.exr figcaption b{color:#b4232a;margin-right:1mm}
/* 清單版後面的圖錄：一個商品一列，主圖 70mm＋介紹，其他圖半頁寬 */
.cat-t{margin-top:4.5mm;font-size:11pt;font-weight:700;border-left:3.5px solid #b4232a;padding-left:2.5mm}
.cat{display:flex;flex-direction:column;margin-top:2mm}
.gi{display:grid;grid-template-columns:70mm 1fr;gap:5mm;padding:3.5mm 2mm 3mm;border-top:1px solid #c5ccd3}
.gi .im{width:70mm;height:70mm;border:1px solid #eef0f2;border-radius:1.5mm;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.gi .im img{max-width:100%;max-height:100%;object-fit:contain}
.gi .nm{font-size:11pt;font-weight:700;line-height:1.4}
.gi .nm .no{color:#b4232a;margin-right:1.5mm}
.gi .sk{font-size:7.6pt;color:#7b8794;margin-top:.6mm}
.gi ul{padding-left:4mm;font-size:8.8pt;line-height:1.65;color:#323f4b;margin-top:1.8mm}
/* 合計、簽章 */
.sum{display:flex;justify-content:space-between;gap:6mm;align-items:flex-start}
.notes{flex:1}
h3{font-size:8.6pt;letter-spacing:2px;color:#b4232a;margin-bottom:1.3mm}
.notes ol{padding-left:4.5mm;font-size:8.8pt;line-height:1.75;color:#323f4b}
.tot{width:70mm;border-collapse:collapse}
.tot td{padding:1.3mm 2mm;font-size:9pt}
.tot tr.g td{border-top:2px solid #1f2933;padding-top:2.2mm;font-size:14pt;font-weight:700;color:#b4232a}
.tot tr.g td:first-child{font-size:9.4pt;color:#1f2933;vertical-align:middle}
.sign{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:4mm;margin-top:5mm}
.terms{font-size:8pt;color:#52606d;line-height:1.7;border-top:1px solid #d9dee3;padding-top:2.5mm}
.box{border:1px solid #c5ccd3;border-radius:1.5mm;height:32mm;position:relative;padding:2mm 2.5mm;font-size:7.8pt;color:#7b8794}
.box img{position:absolute;right:2.5mm;bottom:2mm;height:24mm}
.ln{position:absolute;left:2.5mm;right:2.5mm;bottom:4.5mm;border-top:1px dashed #c5ccd3;font-size:7pt;color:#9aa5b1;padding-top:.8mm}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div class="bar"><button onclick="doPrint()">列印／另存 PDF</button>
  <select id="mode" title="版面"><option value="card">圖文版（一項一列，大圖＋介紹）</option><option value="list">清單版（表格＋後面附商品圖錄）</option></select>
  <button id="btnEdit" style="background:#e0a100" onclick="toggleEdit()">編排圖片</button>
  <button id="btnErp" class="erp" hidden onclick="saveErp()">存進 ERP 報價單</button><span id="hint"></span></div>
<div id="root"></div>
<script>
const MAIN = "let Q=/*DATA*/null;\nconst PREVIEW=!Q;\nif(PREVIEW){try{Q=window.__PV||JSON.parse(localStorage.getItem('tanjun-quote-preview')||'null')}catch(e){}\n  if(!Q){document.body.innerHTML='<p style=\"padding:30px\">找不到預覽資料，請回報價畫面再按一次「預覽報價單」。<\/p>';throw new Error('no preview')}}\nconst e=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst f=v=>Math.round(v||0).toLocaleString('en-US');\nconst H=Q.header, L=Q.lines;\nconst dd=H.docdate, roc=`${+dd.slice(0,4)-1911}/${dd.slice(4,6)}/${dd.slice(6)}`;\nconst lab=H.taxType==='1'?'含稅':'未稅';\ndocument.title=PREVIEW?'報價單預覽 '+(H.cname||''):'報價單 '+H.doc+' '+H.cname;\ndocument.getElementById('hint').textContent=PREVIEW?'預覽，還沒存進 ERP：可以直接列印或存 PDF 給客人；客人要訂了再按「存進 ERP 報價單」。':(H.doc+'　'+H.cname+'　已在 ERP（'+(H.confirmed==='Y'?'已確認':'未確認')+'）');\nif(PREVIEW)document.getElementById('btnErp').hidden=false;\nconst sel=document.getElementById('mode');\nsel.value=Q.mode||(L.filter(l=>l.qty||l.price).length<=10?'card':'list');\nsel.onchange=()=>{Q.mode=sel.value;if(PREVIEW){try{localStorage.setItem('tanjun-quote-preview',JSON.stringify(Q))}catch(x){}}build()};\n\nasync function saveErp(){\n  const E=Q.erp; const list=E.lines.map((l,i)=>`${i+1}. ${L[i].nm}　${l.qty} × ${f(l.price)} = ${f(l.amt)}`).join('\\n');\n  if(!confirm(`確定要存進 ERP 報價單嗎？\\n\\n客戶：${E.cname}（${E.cust}）\\n${list}\\n\\n含稅總計 ${f(H.amount+H.tax)}\\n\\n`+(window.__PHONE?'手機不能直接寫 ERP：會先放進「待存 ERP」清單，回到電腦打開報價程式確認後才寫進 ERP。':'存進去會產生正式報價單號（ERP 未確認狀態）。')))return;\n  const b=document.getElementById('btnErp');b.disabled=true;b.textContent='存進 ERP 中…';\n  try{const r=await fetch('/api/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...E,testRollback:false})});\n    const j=await r.json(); if(!j.ok)throw new Error(j.error);\n    if(j.result&&j.result.queued){alert('已放進「待存 ERP」清單（'+j.result.id+'）。回到電腦打開報價程式，確認後才會寫進 ERP。');b.textContent='已放進待存清單';return}\n    if(!j.result.committed)throw new Error('沒有存進去');\n    try{localStorage.removeItem('tanjun-quote-preview')}catch(x){}\n    if(window.__PENDING){try{await fetch('/api/pendingdone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:window.__PENDING,doc:j.result.doc})})}catch(x){}}\n    alert('已存進 ERP：'+j.result.doc);\n    location.href='/print?doc='+encodeURIComponent(j.result.doc)+'&remark='+encodeURIComponent(Q.remark||'')+'&mode='+sel.value;\n  }catch(x){alert('存進 ERP 失敗：'+x.message);b.disabled=false;b.textContent='存進 ERP 報價單'}\n}\n\n// ---- 共用片段 ----\nconst items=L.filter(l=>l.qty||l.price);\nconst noteOf=l=>{const m=String(l.note||'').match(/^\\s*(\\d+)\\s*(.*)$/);return m?(m[1]+(m[2]?' '+m[2]:'')):(l.note||'')};\nconst pts=l=>(l.intro||'').split(/\\n/).map(s=>s.replace(/^\\s*[\\d０-９]+[\\.、．)]\\s*/,'').trim()).filter(Boolean);\nconst shortUrl=u=>String(u||'').replace(/^https?:\\/\\/(www\\.)?/,'');\nfunction qr(u){try{const q=qrcode(0,'M');q.addData(u);q.make();return q.createSvgTag({cellSize:2,margin:0,scalable:true})}catch(x){return ''}}\nconst ims=l=>Array.isArray(l.imgs)?l.imgs:(l.img?[0]:[]);\nconst src=(l,n)=>(l.ids&&l.ids[n])?'https://lh3.googleusercontent.com/d/'+l.ids[n]+'=w1600':'/img?sku='+encodeURIComponent(l.sku)+'&n='+n;\nconst img=l=>{const a=ims(l);return a.length?`<img src=\"${src(l,a[0])}\">`:''};\nconst ROLE=l=>(l.roles||{});\n// ---- 其他圖的大小：小（三張一排，50mm 高）、中（兩張一排，72mm）、大（整頁寬，150mm）----\n// 預設：字多的圖（盒裝內容、尺寸規格）用大，照片用中。編排模式可以改大小、拖曳排序、套用排法\nconst UNITS={S:2,M:3,L:6}, SZN={S:'小',M:'中',L:'大'};\nconst PRESETS={std:'標準（字多的圖大、照片中）',M:'全部中（兩張一排）',S:'全部小（三張一排）',L:'全部大（一張一排）'};\nconst defSize=r=>['盒裝內容','尺寸規格'].includes(r)?'L':'M';\nfunction sizeOf(l,n){const z=(l.sizes||{})[n];return z||defSize(ROLE(l)[n])}\nfunction fig(l,n){const z=sizeOf(l,n),i=L.indexOf(l);\n  return `<figure class=\"${z}\" draggable=\"true\" data-i=\"${i}\" data-n=\"${n}\"><div class=\"fx\"><select onchange=\"setSize(${i},${n},this.value)\">${Object.keys(SZN).map(k=>`<option value=\"${k}\"${k===z?' selected':''}>${SZN[k]}<\/option>`).join('')}<\/select><button onclick=\"dropPic(${i},${n})\" title=\"這張報價單不放這張\">✕<\/button><\/div>\n    <div class=\"ph\"><img src=\"${src(l,n)}\"><\/div><figcaption><b>${+l.seq}<\/b>${e(ROLE(l)[n]||'')}　${e(l.nm)}<\/figcaption><\/figure>`}\nfunction extraRows(l){const a=ims(l).slice(1),out=[],i=L.indexOf(l);let row=[],used=0;\n  const flush=()=>{if(row.length){out.push({h:'<div class=\"exr\">'+row.map(n=>fig(l,n)).join('')+'<\/div>',it:i,main:false});row=[];used=0}};\n  for(const n of a){const u=UNITS[sizeOf(l,n)];if(used+u>6)flush();row.push(n);used+=u;if(used>=6)flush()}\n  flush();\n  if(out.length) out[0].h='<div>'+`<div class=\"ed\">第 ${+l.seq} 項的圖片排法：<select onchange=\"preset(${i},this.value)\"><option value=\"\">選擇…<\/option>${Object.keys(PRESETS).map(k=>`<option value=\"${k}\">${PRESETS[k]}<\/option>`).join('')}<\/select>　拖曳圖片可以換順序，拖到左邊大圖上就變成主圖；右上角可以改大小或拿掉<\/div>`+out[0].h+'<\/div>';\n  return out}\nfunction persist(){if(PREVIEW){try{localStorage.setItem('tanjun-quote-preview',JSON.stringify(Q))}catch(x){}}const y=scrollY;build();scrollTo(0,y)}\nfunction setSize(i,n,z){const l=L[i];l.sizes=Object.assign({},l.sizes||{},{[n]:z});persist()}\nfunction preset(i,k){if(!k)return;const l=L[i];l.sizes={};if(k!=='std')for(const n of ims(l).slice(1))l.sizes[n]=k;persist()}\nfunction dropPic(i,n){const l=L[i];l.imgs=ims(l).filter(v=>v!==n);persist()}\nfunction movePic(i,from,to){const l=L[i],a=ims(l).slice(),fi=a.indexOf(from),ti=a.indexOf(to);if(fi<0||ti<0||fi===ti)return;\n  a.splice(fi,1);let t=a.indexOf(to);if(ti===0)t=0;else if(fi<ti)t++;a.splice(t,0,from);l.imgs=a;persist()}\nfunction toggleEdit(){document.body.classList.toggle('edit');document.getElementById('btnEdit').textContent=document.body.classList.contains('edit')?'編排完成':'編排圖片';persist()}\nfunction doPrint(){if(document.body.classList.contains('edit'))toggleEdit();setTimeout(()=>print(),300)}\nlet DRAG=null;\ndocument.addEventListener('dragstart',ev=>{const f=ev.target.closest&&ev.target.closest('[data-n]');if(!f||!document.body.classList.contains('edit'))return;DRAG={i:+f.dataset.i,n:+f.dataset.n};ev.dataTransfer.effectAllowed='move'});\ndocument.addEventListener('dragover',ev=>{const t=ev.target.closest&&ev.target.closest('[data-n]');if(!DRAG||!t||+t.dataset.i!==DRAG.i)return;ev.preventDefault();document.querySelectorAll('.drop-on').forEach(x=>x.classList.remove('drop-on'));t.classList.add('drop-on')});\ndocument.addEventListener('drop',ev=>{const t=ev.target.closest&&ev.target.closest('[data-n]');if(!DRAG||!t)return;ev.preventDefault();const d=DRAG;DRAG=null;if(+t.dataset.i===d.i)movePic(d.i,d.n,+t.dataset.n)});\ndocument.addEventListener('dragend',()=>{DRAG=null;document.querySelectorAll('.drop-on').forEach(x=>x.classList.remove('drop-on'))});\nconst HEAD='<div class=\"top\"><div class=\"co\"><h1>天掌五金企業股份有限公司<\/h1><p>統一編號 53264563　｜　彰化縣田中鎮中南路三段467號　｜　電話 04-8742490　｜　傳真 04-8751490<\/p><\/div><div class=\"ttl\"><h2>報價單<\/h2><div class=\"en\">QUOTATION<\/div><\/div><\/div>';\nconst INFO=`<div class=\"info\"><div class=\"card cu\"><div class=\"k\">客戶名稱<\/div><div class=\"big\">${e(H.cname)}<\/div><div class=\"k\">聯絡人<\/div><div>${e(H.contact)}<\/div><div class=\"k\">電話<\/div><div>${e(H.tel)}<\/div><\/div>`+\n  `<div class=\"card\"><div class=\"k\">報價單號<\/div><div class=\"b\">${H.doc?e(H.doc):'—'}<\/div><div class=\"k\">報價日期<\/div><div>${roc}<\/div><div class=\"k\">業務人員<\/div><div>${e(H.salesName)}<\/div><div class=\"k\">付款方式<\/div><div>${e(H.pay)}<\/div><\/div><\/div>`;\nconst notes=(Q.remark?[Q.remark]:[]);\nconst END='<div class=\"end\"><div class=\"sum\"><div class=\"notes\">'+(notes.length?'<h3>備註<\/h3><ol>'+notes.map(x=>'<li>'+e(x)+'<\/li>').join('')+'<\/ol>':'')+'<\/div><table class=\"tot\">'+\n  `<tr><td>總數量<\/td><td class=\"r\">${f(H.qty)}<\/td><\/tr><tr><td>未稅金額<\/td><td class=\"r\">${f(H.amount)}<\/td><\/tr><tr><td>營業稅 5%<\/td><td class=\"r\">${f(H.tax)}<\/td><\/tr>`+\n  `<tr class=\"g\"><td>含稅總計<\/td><td class=\"r\">
