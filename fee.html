<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1f2a3a">
<title>天掌 費用單</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f3f4f6;color:#1b1f24;font-size:16px}
header{background:#1f2a3a;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header b{font-size:18px}header .sp{flex:1}header small{opacity:.8}
main{padding:12px;max-width:560px;margin:auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
label{display:block;font-size:13px;color:#555;margin:10px 0 4px}
input,select,textarea{width:100%;font-size:17px;padding:10px;border:1px solid #c9ced4;border-radius:8px;background:#fff}
textarea{min-height:60px}
.btn{display:block;width:100%;font-size:18px;padding:13px;border:0;border-radius:10px;background:#1f2a3a;color:#fff;margin-top:12px}
.btn.amber{background:#b45309}.btn.light{background:#e5e7eb;color:#1b1f24}.btn.red{background:#b91c1c}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
.seg{display:flex;gap:6px}.seg label{flex:1;margin:0;border:1px solid #c9ced4;border-radius:8px;padding:10px;text-align:center;font-size:16px;color:#1b1f24}
.seg input{display:none}.seg label.on{background:#1f2a3a;color:#fff;border-color:#1f2a3a}
.shots{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.shots div{position:relative}.shots img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.shots a{position:absolute;top:-6px;right:-6px;background:#b91c1c;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:13px}
.cam{border:2px dashed #9aa3ad;border-radius:12px;padding:18px;text-align:center;color:#555;font-size:17px}
.msg{padding:10px;border-radius:8px;margin-top:10px;font-size:15px}.msg.ok{background:#dcfce7}.msg.bad{background:#fee2e2}.msg.info{background:#e0ecff}
.doc{border-top:1px solid #eee;padding:10px 0}.doc:first-child{border-top:0}
.st{display:inline-block;font-size:13px;padding:2px 8px;border-radius:10px;background:#e5e7eb}
.st.已送出{background:#e0ecff}.st.處理中{background:#fef3c7}.st.已登打{background:#dcfce7}.st.退回{background:#fee2e2}.st.作廢{background:#eee;color:#888}
.mut{color:#6b7280;font-size:13px}.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
footer{text-align:center;color:#888;font-size:12px;padding:16px}
</style></head><body>
<header><b>🧾 費用單</b><span class="sp"></span><small id="me"></small></header>
<main>
  <section id="vLogin" class="card hide">
    <label>密碼（跟電腦版「天掌 費用登打」同一組）</label><input id="pw" type="password" inputmode="numeric" autocomplete="current-password">
    <button class="btn" onclick="login()">進入</button><div id="loginMsg"></div>
  </section>

  <section id="vWho" class="card hide">
    <label>我是誰</label><select id="who"></select>
    <label>哪家店（費用算哪裡）</label><select id="store"></select>
    <button class="btn" onclick="saveWho()">好</button>
  </section>

  <section id="vNew" class="card hide">
    <div class="cam" onclick="document.getElementById('cam').click()">📷 拍照（或選照片／PDF）<br><span class="mut">收據、發票、帳單；正反面可以多張，一張照片拍好幾張發票也可以</span></div>
    <input id="cam" type="file" accept="image/*,application/pdf" capture="environment" multiple class="hide" onchange="addShots(this.files);this.value=''">
    <div class="row" style="margin-top:6px"><button class="btn light" style="margin-top:0" onclick="document.getElementById('pick').click()">從相簿選</button></div>
    <input id="pick" type="file" accept="image/*,application/pdf" multiple class="hide" onchange="addShots(this.files);this.value=''">
    <div class="shots" id="shots"></div>
    <label>金額（可以不填，電腦會用 AI 讀照片）</label><input id="amount" type="number" inputmode="decimal" placeholder="不填也可以">
    <label>說明（買什麼、哪裡的費用）</label><textarea id="memo" placeholder="例如：烏日加油、11 月電話費、彰化影印紙"></textarea>
    <label>付款</label>
    <div class="seg" id="paySeg"><label class="on"><input type="radio" name="pay" value="paid" checked>已經付了</label><label><input type="radio" name="pay" value="later">還沒付（月結、開票）</label></div>
    <button class="btn amber" id="btnSend" onclick="send()">送出給會計</button>
    <div id="sendMsg"></div>
  </section>

  <section id="vList" class="card hide">
    <div class="row" style="align-items:center"><b>我的費用單（60 天）</b><select id="scope" style="flex:0 0 120px" onchange="loadMine()"><option value="me">只看我的</option><option value="all">全部人</option></select></div>
    <div id="docs"><div class="mut">讀取中…</div></div>
  </section>
  <section class="card hide" id="vEdit">
    <b>改好重送 <span id="editId"></span></b><div id="editMsg" class="msg bad"></div>
    <label>金額</label><input id="eAmount" type="number" inputmode="decimal">
    <label>說明</label><textarea id="eMemo"></textarea>
    <label>補照片（可空白）</label><input id="ePick" type="file" accept="image/*,application/pdf" multiple onchange="addShots(this.files,'e');this.value=''"><div class="shots" id="eShots"></div>
    <button class="btn amber" onclick="resend()">重送</button><button class="btn light" onclick="closeEdit()">取消</button>
  </section>
</main>
<footer>天掌五金 費用單 · 版本 2026-11-19a · <a href="#" onclick="logout();return false">登出</a> · <a href="#" onclick="show('vWho');return false">換人／換店</a></footer>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzIq-SIu14gDEQ_pf918YGzbpV_fIviKrYUwTuwfvuR7fw8MSFr6fMWOBDLkOI1-Xv3/exec';
const $ = id => document.getElementById(id);
let TOKEN = localStorage.getItem('feeTok') || '', ME = JSON.parse(localStorage.getItem('feeMe') || 'null'), PEOPLE = [], STORES = {}, SHOTS = [], ESHOTS = [], EDIT = null;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function call(a, body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ a, token: TOKEN }, body || {})) });
  const j = await r.json(); if (j.login) { TOKEN = ''; localStorage.removeItem('feeTok'); show('vLogin'); throw new Error(j.error); }
  if (!j.ok) throw new Error(j.error || '失敗'); return j;
}
function show(v) { ['vLogin', 'vWho', 'vNew', 'vList', 'vEdit'].forEach(x => $(x).classList.toggle('hide', !(x === v || (v === 'main' && (x === 'vNew' || x === 'vList'))))); }
function msg(el, cls, t) { $(el).innerHTML = t ? `<div class="msg ${cls}">${t}</div>` : ''; }
async function login() { try { const j = await call('login', { pw: $('pw').value }); TOKEN = j.token; localStorage.setItem('feeTok', TOKEN); $('pw').value = ''; await start(); } catch (e) { msg('loginMsg', 'bad', esc(e.message)) } }
function logout() { TOKEN = ''; localStorage.removeItem('feeTok'); show('vLogin') }
async function start() {
  if (!TOKEN) { show('vLogin'); return }
  try { const j = await call('people'); PEOPLE = j.people; STORES = j.stores; } catch (e) { if (TOKEN) alert(e.message); return }
  $('who').innerHTML = '<option value="">（選自己）</option>' + PEOPLE.map(p => `<option value="${esc(p.id)}">${esc(p.name)}（${esc(p.id)}）</option>`).join('');
  $('store').innerHTML = Object.keys(STORES).map(k => `<option value="${k}">${esc(STORES[k])}</option>`).join('');
  if (!ME) { show('vWho'); return }
  $('me').textContent = ME.name + '・' + (STORES[ME.store] || ME.store); show('main'); loadMine();
}
function saveWho() { const id = $('who').value; if (!id) { alert('請選自己的名字'); return } const p = PEOPLE.find(x => x.id === id); ME = { id, name: p ? p.name : id, store: $('store').value }; localStorage.setItem('feeMe', JSON.stringify(ME)); start(); }
$('who').onchange = () => { const p = PEOPLE.find(x => x.id === $('who').value); if (p && p.store && STORES[p.store]) $('store').value = p.store; };
document.querySelectorAll('#paySeg input').forEach(r => r.onchange = () => document.querySelectorAll('#paySeg label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked)));
async function shrink(file) {
  if (file.type === 'application/pdf') { const u = new Uint8Array(await file.arrayBuffer()); let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return { media: 'application/pdf', data: btoa(s), thumb: '' } }
  const url = URL.createObjectURL(file); const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url });
  const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); const d = c.toDataURL('image/jpeg', 0.82); return { media: 'image/jpeg', data: d.split(',')[1], thumb: d };
}
async function addShots(files, which) { const arr = which === 'e' ? ESHOTS : SHOTS; for (const f of files) { try { arr.push(await shrink(f)) } catch (e) { alert('照片讀不到') } } drawShots(which) }
function drawShots(which) { const arr = which === 'e' ? ESHOTS : SHOTS; $(which === 'e' ? 'eShots' : 'shots').innerHTML = arr.map((s, i) => `<div>${s.thumb ? `<img src="${s.thumb}">` : '<div class="cam" style="width:84px;height:84px;padding:20px 0">PDF</div>'}<a onclick="(${which === 'e' ? 'ESHOTS' : 'SHOTS'}).splice(${i},1);drawShots('${which || ''}')">✕</a></div>`).join('') }
async function send() {
  if (!SHOTS.length) { alert('請先拍照'); return } const amt = $('amount').value === '' ? '' : Number($('amount').value); if (amt !== '' && !(amt > 0)) { alert('金額不對'); return }
  $('btnSend').disabled = true; msg('sendMsg', 'info', '上傳中…（照片多會久一點）');
  try { const j = await call('create', { who: ME.id, whoName: ME.name, store: ME.store, amount: amt, memo: $('memo').value, pay: document.querySelector('#paySeg input:checked').value, photos: SHOTS.map(s => ({ media: s.media, data: s.data })) });
    msg('sendMsg', 'ok', `已送出：${esc(j.id)}。會計打進 ERP 後，下面會看到 ERP 單號。`); SHOTS = []; drawShots(); $('amount').value = ''; $('memo').value = ''; loadMine();
  } catch (e) { msg('sendMsg', 'bad', '沒有送出：' + esc(e.message) + '（照片還在，可以再按一次）') }
  $('btnSend').disabled = false;
}
async function loadMine() {
  try { const j = await call('mine', { who: $('scope').value === 'all' ? '' : ME.id });
    $('docs').innerHTML = j.docs.map(d => `<div class="doc"><div class="row"><b class="num">${d.amount ? "$" + Number(d.amount).toLocaleString() : "（金額待電腦讀）"}</b><span style="text-align:right"><span class="st ${esc(d.status)}">${esc(d.status)}</span></span></div>
      <div>${esc(d.memo || '（沒寫說明）')}</div><div class="mut">${esc(d.at.slice(5, 16))}・${esc(d.whoName)}・${esc(d.storeName)}・${esc(d.pay)}・照片 ${d.photos} 張・${esc(d.id)}</div>
      ${d.erpNo ? `<div>ERP：<b>${esc(d.erpNo)}</b></div>` : ''}${d.status === '退回' ? `<div class="msg bad">退回原因：${esc(d.msg)}</div><button class="btn amber" onclick='openEdit(${JSON.stringify(d)})'>改好重送</button>` : ''}
      ${['已送出', '退回'].includes(d.status) && d.who === ME.id ? `<button class="btn light" onclick="cancelDoc('${esc(d.id)}')">作廢這張</button>` : ''}</div>`).join('') || '<div class="mut">還沒有</div>';
  } catch (e) { $('docs').innerHTML = `<div class="msg bad">${esc(e.message)}</div>` }
}
function openEdit(d) { EDIT = d; ESHOTS = []; drawShots('e'); $('editId').textContent = d.id; $('editMsg').textContent = '退回原因：' + d.msg; $('eAmount').value = d.amount; $('eMemo').value = d.memo || ''; show('vEdit'); window.scrollTo(0, 0) }
function closeEdit() { EDIT = null; show('main') }
async function resend() { try { await call('resubmit', { id: EDIT.id, amount: Number($('eAmount').value), memo: $('eMemo').value, photos: ESHOTS.map(s => ({ media: s.media, data: s.data })) }); alert('已重送'); closeEdit(); loadMine() } catch (e) { alert(e.message) } }
async function cancelDoc(id) { if (!confirm('作廢 ' + id + '？')) return; try { await call('cancel', { id }); loadMine() } catch (e) { alert(e.message) } }
start();
</script></body></html>
